plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'io.synthesized.sample.bank'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Overrides of the Spring Boot 3.5.16 dependency BOM.
// Boot 3.5.16 pins Tomcat 10.1.55. That version has CVE-2026-65905,
// CVE-2026-65182 and CVE-2026-68525, which are all critical. Tomcat 10.1.58
// or later corrects them.
// Boot 3.5.16 also pins commons-lang3 3.17.0, which has CVE-2025-48924.
// commons-lang3 3.18.0 or later corrects it.
// Boot 3.5.16 also pins jackson-bom 2.21.4. springdoc-openapi 2.9.1 asks for
// jackson-databind 2.22.1, but the BOM pulls it back to 2.21.4. That version
// has CVE-2026-59889, CVE-2026-54515 and GHSA-mhm7-754m-9p8w. jackson 2.21.5
// or later corrects all three.
// Boot 3.5.16 also pins log4j2 2.24.3, which has CVE-2026-49844. log4j 2.25.5
// corrects it.
//
// The fault is not reachable in these applications. It needs JSON
// serialization of a MapMessage that holds a non-finite float. These
// applications log through Logback, log4j-core is not on the classpath, and
// log4j-api arrives only as the API side of log4j-to-slf4j, which reads only
// getFormattedMessage. No shipped class refers to MapMessage.
//
// The override is here anyway, for two reasons. The goal for this repository
// is no known CVE in any component, and 2.24.3 sits inside the advisory range
// whether or not the code path runs. A scanner that matches on the version of
// an artifact also cannot see reachability, so leaving 2.24.3 would report a
// finding on every image for as long as it ships.
ext['tomcat.version'] = '10.1.59'
ext['commons-lang3.version'] = '3.20.0'
ext['jackson-bom.version'] = '2.21.6'
ext['log4j2.version'] = '2.25.5'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.postgresql:postgresql:42.7.13'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

test {
    useJUnitPlatform()
}
