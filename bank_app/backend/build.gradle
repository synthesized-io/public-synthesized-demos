// The Spring Boot Gradle plugin brings commons-lang3 3.16.0 onto the build
// classpath through spring-boot-buildpack-platform. That version has
// CVE-2025-48924. The dependency submission workflow reports the build
// classpath to the dependency graph, so Dependabot reports it. commons-lang3
// 3.18.0 or later corrects it.
buildscript {
    dependencies {
        constraints {
            classpath 'org.apache.commons:commons-lang3:3.20.0'
        }
    }
}

plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'io.synthesized.sample.bank'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Spring Boot 4.1.2 (Spring Framework 7.0.10).
// Spring Framework 6.2.x has CVE-2026-47884 (XsltView path limitation) and
// CVE-2026-47890 (SSE stream corruption). Both are critical, and no 6.2.x
// release corrects them. Spring Framework 7.0.9 or later corrects both, so
// the build moves to Boot 4.
// The Boot 4.1.2 BOM also pins versions that correct the earlier findings:
// Tomcat 11.0.27, commons-lang3 3.20.0, jackson 2.21.7 (jackson-2-bom),
// log4j2 2.25.5, postgresql 42.7.14, httpclient5 5.6.5 and httpcore5 5.4.4.
// The overrides that the 3.5.16 build needed are no longer necessary.

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

test {
    useJUnitPlatform()
}
