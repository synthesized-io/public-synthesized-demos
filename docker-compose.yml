      - SPRING_DATASOURCE_PROD_USERNAME=apiuser
      - SPRING_DATASOURCE_PROD_PASSWORD=apipassword
    ports:
      - "${INSURANCE_BACKEND_PORT:-8086}:8080"
    depends_on:
      insurance-postgres:
        condition: service_healthy
    networks:
      - insurance-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api-docs > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Insurance Frontend
  insurance-frontend:
    build:
      context: ./insurance_app/frontend
      dockerfile: Dockerfile
    container_name: insurance-frontend
    ports:
      - "${INSURANCE_FRONTEND_PORT:-3008}:80"
    depends_on:
