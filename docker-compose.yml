volumes:
  bank_postgres_data:
    driver: local
  insurance_postgres_data:
    driver: local
  healthcare_postgres_data:
    driver: local

networks:
  bank-network:
    driver: bridge
  insurance-network:
    driver: bridge
  healthcare-network:
    driver: bridge