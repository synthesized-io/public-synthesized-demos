name: build-check

# Build-only safety net for pull requests.
#
# Why this workflow exists:
# - The ci.yml workflow builds and pushes the bank application only. A break in
#   the healthcare or the insurance application reaches main with no warning.
# - The three frontends move from Create React App to Vite. That change can
#   break a build in one application and not in another.
#
# This workflow pushes nothing. It has no AWS credentials and no registry login.
# It only proves that each of the six components still compiles.

on:
  pull_request:
  workflow_dispatch:

# Least privilege. The jobs only read the repository code.
permissions:
  contents: read

jobs:
  frontend:
    name: Build ${{ matrix.app }} frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - bank
          - healthcare
          - insurance
    defaults:
      run:
        working-directory: ${{ matrix.app }}_app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Vite 8 needs Node 20.19 or later. Node 22 is the current LTS release.
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Build ${{ matrix.app }} backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - bank
          - healthcare
          - insurance
    defaults:
      run:
        working-directory: ${{ matrix.app }}_app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      # This step only sets up Gradle and its cache. It runs no build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build
