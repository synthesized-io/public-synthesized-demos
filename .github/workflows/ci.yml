name: ci

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      BACKEND_IMAGE_NAME: bank-demo-backend
      FRONTEND_IMAGE_NAME: bank-demo-frontend
      DATABASE_IMAGE_NAME: bank-demo-database
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set short commit SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # By default, QEMU will create almost a dozen VMs. Limit it to just the architectures we care about.
          platforms: arm64, amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to shared ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push bank demo backend
        uses: docker/build-push-action@v6
        with:
          context: ./bank_app/backend
          file: ./bank_app/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build and push bank demo frontend
        uses: docker/build-push-action@v6
        with:
          context: ./bank_app/frontend
          file: ./bank_app/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Build and push bank demo database
        uses: docker/build-push-action@v6
        with:
          context: ./bank_app/database
          file: ./bank_app/database/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.DATABASE_IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.DATABASE_IMAGE_NAME }}:latest
