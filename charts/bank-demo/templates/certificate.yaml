{{/* Not gated on the exposure condition. statefulset.yaml mounts
     ssl.certManager.secretName whenever ssl.enabled and certManager.enabled,
     so skipping the Certificate with exposure off left the database pod in
     ContainerCreating on a secret that nothing created. The name the
     certificate covers follows connectionHost, so it matches whichever
     address clients are handed. */}}
{{- if and .Values.ssl.enabled .Values.ssl.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "bank-demo.fullname" . }}-tls
  labels:
    {{- include "bank-demo.labels" . | nindent 4 }}
spec:
  secretName: {{ required "ssl.certManager.secretName is required when ssl.certManager.enabled=true" .Values.ssl.certManager.secretName }}
  dnsNames:
    - {{ include "bank-demo.connectionHost" . }}
  issuerRef:
    name: {{ required "ssl.certManager.issuerRef.name is required when ssl.certManager.enabled=true" .Values.ssl.certManager.issuerRef.name }}
    kind: {{ default "ClusterIssuer" .Values.ssl.certManager.issuerRef.kind }}
{{- end }}
