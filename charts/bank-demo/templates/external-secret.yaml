apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-database-credentials
  labels:
    {{- include "bank-demo.labels" . | nindent 4 }}
spec:
  refreshInterval: "0s"
  {{- /* The two generators below are stateless: every reconcile returns a new
       password. Postgres creates the role once, at initdb, and keeps its data
       on a PVC, so a second set of values locks the database out of itself.
       CreatedOnce pins the values after the first creation. It is safe here
       because this object now carries only the generated credentials. */}}
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.database.usernameKey }}: "{{ `{{ index . \"username\" }}` }}"
        {{ .Values.database.passwordKey }}: "{{ `{{ index . \"password\" }}` }}"
        {{- /* The three URLs below are a migration shim, not the live copy.
            configmap-jdbc-urls.yaml holds that. Governor's api still mounts
            these keys from this Secret, with no optional flag, so a Secret
            created without them leaves its whole pod in
            CreateContainerConfigError. They stay until Governor reads the
            ConfigMap, then a follow-up drops them.

            CreatedOnce above means a later edit here reaches new tenants
            only. That is the point: on an existing tenant these keys keep
            whatever value they were created with, and the ConfigMap carries
            the correction. */}}
        jdbc-url-seed: "jdbc:postgresql://{{ include "bank-demo.connectionHost" . }}:{{ include "bank-demo.connectionPort" . }}/{{ .Values.database.names.seed }}?sslmode={{ include "bank-demo.sslMode" . }}"
        jdbc-url-prod: "jdbc:postgresql://{{ include "bank-demo.connectionHost" . }}:{{ include "bank-demo.connectionPort" . }}/{{ .Values.database.names.prod }}?sslmode={{ include "bank-demo.sslMode" . }}"
        jdbc-url-testing: "jdbc:postgresql://{{ include "bank-demo.connectionHost" . }}:{{ include "bank-demo.connectionPort" . }}/{{ .Values.database.names.testing }}?sslmode={{ include "bank-demo.sslMode" . }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank-database-username
      rewrite:
        - regexp:
            source: "^password$"
            target: "username"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank-database-password
      rewrite:
        - regexp:
            source: "^password$"
            target: "password"
