apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-database-credentials
  labels:
    {{- include "bank-demo.labels" . | nindent 4 }}
spec:
  refreshInterval: "0s"
  {{- /* The two generators below are stateless: every reconcile returns a new
       password. Postgres creates the role once, at initdb, and keeps its data
       on a PVC, so a second set of values locks the database out of itself.
       CreatedOnce pins the values after the first creation. It is safe here
       because this object now carries only the generated credentials. */}}
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.database.usernameKey }}: "{{ `{{ index . \"username\" }}` }}"
        {{ .Values.database.passwordKey }}: "{{ `{{ index . \"password\" }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank-database-username
      rewrite:
        - regexp:
            source: "^password$"
            target: "username"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank-database-password
      rewrite:
        - regexp:
            source: "^password$"
            target: "password"
