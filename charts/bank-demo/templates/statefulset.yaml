{{- $sslEnabled := .Values.ssl.enabled }}
{{- $certManagerEnabled := and $sslEnabled .Values.ssl.certManager.enabled }}
{{- $tlsSecretName := .Values.ssl.existingSecretName }}
{{- if $certManagerEnabled }}
{{- $tlsSecretName = .Values.ssl.certManager.secretName }}
{{- end }}
{{- if $sslEnabled }}
{{- $tlsSecretName = required "ssl.existingSecretName or ssl.certManager.secretName is required when ssl.enabled=true" $tlsSecretName }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bank-demo.fullname" . }}
  labels:
    {{- include "bank-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bank-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  serviceName: {{ include "bank-demo.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "bank-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $sslEnabled }}
      initContainers:
        - name: {{ include "bank-demo.fullname" . }}-ssl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cert_dir="/var/lib/postgresql/data/certs"
              mkdir -p "$cert_dir"
              cp /tls-secret/tls.crt "$cert_dir/server.crt"
              cp /tls-secret/tls.key "$cert_dir/server.key"
              pg_uid="$(id -u postgres)"
              pg_gid="$(id -g postgres)"
              chown "$pg_uid:$pg_gid" "$cert_dir" "$cert_dir/server.key" "$cert_dir/server.crt"
              chmod 700 "$cert_dir"
              chmod 600 "$cert_dir/server.key"
          env:
            - name: SSL_CERT_CN
              value: {{ include "bank-demo.connectionHost" . | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls-secret
              mountPath: /tls-secret
              readOnly: true
          resources:
            {{- toYaml .Values.sslInitResources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ include "bank-demo.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $sslEnabled }}
          args:
            - "-c"
            - "ssl=on"
            - "-c"
            - "ssl_cert_file=/var/lib/postgresql/data/certs/server.crt"
            - "-c"
            - "ssl_key_file=/var/lib/postgresql/data/certs/server.key"
          {{- end }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.bootstrapName | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - psql -U "$POSTGRES_USER" -d {{ .Values.database.names.testing | quote }} -tAc "SELECT 1" | grep -q 1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if $sslEnabled }}
      volumes:
        - name: tls-secret
          secret:
            secretName: {{ $tlsSecretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
