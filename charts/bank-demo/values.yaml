resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

sslInitResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

image:
  repository: synthesizedio/bank-demo-database
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

database:
  bootstrapName: postgres
  sslMode: ""
  usernameKey: username
  passwordKey: password
  secretName: bank-database-credentials
  names:
    seed: bank_seed
    prod: bank_prod
    testing: bank_testing

service:
  type: ClusterIP
  port: 5432

external:
  enabled: false
  hostnamePrefix: bank-app-db

dbExposure:
  enabled: false
  domain: ""
  port: 5432
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

ssl:
  enabled: false
  existingSecretName: ""
  certManager:
    enabled: false
    secretName: bank-demo-tls
    issuerRef:
      name: ""
      kind: ClusterIssuer

persistence:
  accessMode: ReadWriteOnce
  size: 10Gi

backend:
  enabled: false
  name: bank-backend
  replicaCount: 1
  image:
    repository: synthesizedio/bank-demo-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  container:
    port: 8080
  service:
    type: ClusterIP
    port: 8080
  database:
    secretName: bank-database-credentials
    usernameKey: username
    passwordKey: password
    jdbcUrlKeys:
      seed: jdbc-url-seed
      prod: jdbc-url-prod
      testing: jdbc-url-testing

frontend:
  enabled: false
  name: bank-frontend
  replicaCount: 1
  image:
    repository: synthesizedio/bank-demo-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  container:
    port: 80
  service:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  name: bank-demo
  ingressClassName: alb
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
