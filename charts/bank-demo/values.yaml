resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

sslInitResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

image:
  repository: synthesizedio/bank-demo-database
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-credentials

nameOverride: ""
fullnameOverride: ""

database:
  bootstrapName: postgres
  layout: databases
  usernameKey: username
  passwordKey: password
  secretName: bank-database-credentials
  names:
    small: small
    prod: prod
    testing: testing

service:
  type: ClusterIP
  port: 5432

external:
  enabled: false
  hostnamePrefix: bank-app-db

dbExposure:
  enabled: false
  domain: ""
  port: 5432
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

ssl:
  enabled: true
  existingSecretName: ""
  certManager:
    enabled: false
    secretName: bank-demo-tls
    issuerRef:
      name: ""
      kind: ClusterIssuer

persistence:
  accessMode: ReadWriteOnce
  size: 10Gi

nodeSelector: {}
tolerations: []
affinity: {}
